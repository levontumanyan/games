<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Workout Routine Player</title>
	<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💪</text></svg>">
	<link rel="stylesheet" href="css/styles.css?v=7">
</head>
<body>
	<div class="app-container">

		<!-- ── Sidebar ────────────────────────────────────────────────── -->
		<aside class="sidebar">
			<div class="sidebar-header">
				<div class="sidebar-header-row">
					<div>
						<h1>🏋️ Workout</h1>
						<p>Custom routine player</p>
					</div>
					<button id="fullscreen-app-btn" class="btn btn-ghost btn-sm" title="Toggle Fullscreen (F)">
						<svg class="icon-enter-fullscreen" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
						<svg class="icon-exit-fullscreen hidden" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3v3a2 2 0 0 1-2 2H3m18 0h-3a2 2 0 0 1-2-2V3m0 18v-3a2 2 0 0 1 2-2h3M3 16h3a2 2 0 0 1 2 2v3"/></svg>
					</button>
				</div>
			</div>

			<div class="sidebar-actions">
				<button id="add-workout-btn" class="btn btn-primary btn-sm">+ Add Workout</button>
			</div>

			<div class="routine-list-container">
				<ul id="routine-list"></ul>
			</div>

			<div class="sidebar-footer">
				<div class="sidebar-footer-buttons">
					<button id="export-btn" class="btn btn-ghost btn-sm">📤 Export</button>
					<button id="import-btn" class="btn btn-ghost btn-sm">📥 Import</button>
				</div>
				<div id="sync-status" class="sync-status" title="Server Sync Status">☁️ Synced</div>
			</div>
		</aside>

		<!-- ── Main Content ──────────────────────────────────────────── -->
		<main class="main-content">

			<!-- ── Empty View ────────────────────────────────────────── -->
			<div id="empty-view" class="empty-state-view">
				<p class="empty-message">Select or create a workout to get started.</p>
			</div>

			<!-- ── Routine Overview View (View Mode) ────────────────── -->
			<div id="routine-view" class="hidden">
				<div id="routine-overview-container"></div>
			</div>

			<!-- ── Editor View (Edit Mode) ──────────────────────────── -->
			<div id="editor-view" class="hidden">
				<div id="editor-content">
					<div class="editor-header">
						<input
							type="text"
							id="routine-title"
							class="input-title"
							placeholder="Workout title..."
						>
						<button id="done-editing-btn" class="btn btn-primary">✓ Done</button>
						<button id="delete-routine-btn" class="btn btn-danger">🗑 Delete</button>
					</div>

					<div class="step-actions">
						<button id="add-clip-btn" class="btn btn-sm">
							<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m22 8-6 4 6 4V8Z"/><rect width="14" height="12" x="2" y="6" rx="2" ry="2"/></svg>
							Add Clip
						</button>
						<button id="add-timer-btn" class="btn btn-sm">
							<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2 2"/><path d="M10 2h4"/><path d="m19 5-1.5 1.5"/></svg>
							Add Timer
						</button>
						<button id="add-break-btn" class="btn btn-sm">
							<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2h-4a1 1 0 0 0-1 1v2h6V3a1 1 0 0 0-1-1z"/><path d="M15 2a3 3 0 0 1 3 3v0"/><rect x="7" y="6" width="10" height="15" rx="2"/><line x1="7" y1="10" x2="17" y2="10" stroke-width="1.5" opacity="0.6"/></svg>
							Add Break
						</button>
					</div>

					<div id="step-list"></div>
				</div>
			</div>

			<!-- ── Player View ───────────────────────────────────────── -->
			<div id="player-view" class="hidden">

				<!-- Floating Top Bar -->
				<div class="player-top-bar">
					<button id="player-back-btn" class="btn btn-ghost btn-sm" title="Exit Workout (Esc)">
						<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
						Exit
					</button>
					<span id="player-routine-title" class="player-routine-title">Workout</span>
					<button id="fullscreen-top-btn" class="btn btn-ghost btn-sm" title="Toggle Fullscreen (F)">
						<svg class="icon-enter-fullscreen" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
						<svg class="icon-exit-fullscreen hidden" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3v3a2 2 0 0 1-2 2H3m18 0h-3a2 2 0 0 1-2-2V3m0 18v-3a2 2 0 0 1 2-2h3M3 16h3a2 2 0 0 1 2 2v3"/></svg>
					</button>
				</div>

				<!-- Stage: video or timer -->
				<div class="player-stage">
					<!-- YouTube player container -->
					<div id="video-wrapper" class="hidden">
						<div id="youtube-player"></div>
					</div>

					<!-- Timer overlay -->
					<div id="timer-overlay" class="hidden">
						<div class="timer-stage-content">
							<div class="timer-ring-container">
								<svg viewBox="0 0 300 300">
									<circle class="timer-ring-bg" cx="150" cy="150" r="140" />
									<circle id="timer-ring" cx="150" cy="150" r="140" />
								</svg>
								<div class="timer-center-text">
									<div id="timer-display">00:30</div>
									<div id="timer-label">Exercise</div>
								</div>
							</div>
							<!-- Up Next preview card for break steps -->
							<div id="up-next-card" class="up-next-card hidden">
								<span class="up-next-eyebrow">UP NEXT</span>
								<div class="up-next-details">
									<div id="up-next-media-thumb" class="up-next-media-thumb"></div>
									<div class="up-next-text">
										<div id="up-next-label" class="up-next-label">—</div>
										<div id="up-next-meta" class="up-next-meta"></div>
									</div>
								</div>
							</div>
						</div>
					</div>
				</div>

				<!-- Step info bar (Floating bottom stack) -->
				<div class="player-floating-bottom">
					<div class="player-info">
						<div class="player-step-info">
							<span id="current-step-label">—</span>
							<span id="current-step-type"></span>
						</div>
						<span id="step-counter">Step 0 / 0</span>
						<span id="next-step-preview"></span>
					</div>

					<!-- Music controls bar -->
					<div id="music-controls-bar" class="music-controls-bar hidden">
						<span class="music-controls-icon">🎵</span>
						<button id="music-prev-btn" class="btn btn-ghost btn-sm" title="Previous track">⏮</button>
						<span id="music-track-name" class="music-track-name">No music</span>
						<button id="music-next-btn" class="btn btn-ghost btn-sm" title="Next track">⏭</button>
						<input type="range" id="music-volume" min="0" max="100" value="50" class="volume-slider" title="Music volume">
						<button id="music-mute-btn" class="btn btn-ghost btn-sm" title="Mute music">🔊</button>
					</div>

					<!-- Step timeline -->
					<div id="step-timeline"></div>

					<!-- Playback controls -->
					<div class="player-controls-container">
						<div class="player-controls">
							<button id="stop-btn" class="btn-control btn-control-secondary" title="Exit Workout (Esc)">
								<svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><rect x="5" y="5" width="14" height="14" rx="2"/></svg>
							</button>
							<button id="prev-btn" class="btn-control btn-control-secondary" title="Previous step (←)">
								<svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><polygon points="19,20 9,12 19,4"/><rect x="5" y="4" width="3" height="16" rx="1"/></svg>
							</button>
							<button id="play-pause-btn" class="btn-control btn-control-hero" title="Pause / Play (Space)">
								<svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><rect x="6" y="4" width="4" height="16" rx="1.5"/><rect x="14" y="4" width="4" height="16" rx="1.5"/></svg>
							</button>
							<button id="skip-btn" class="btn-control btn-control-secondary" title="Next step (→)">
								<svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><polygon points="5,4 15,12 5,20"/><rect x="16" y="4" width="3" height="16" rx="1"/></svg>
							</button>
							<button id="reset-btn" class="btn-control btn-control-secondary" title="Restart routine (R)">
								<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
							</button>
							<button id="fullscreen-dock-btn" class="btn-control btn-control-secondary" title="Toggle Fullscreen (F)">
								<svg class="icon-enter-fullscreen" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
								<svg class="icon-exit-fullscreen hidden" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3v3a2 2 0 0 1-2 2H3m18 0h-3a2 2 0 0 1-2-2V3m0 18v-3a2 2 0 0 1 2-2h3M3 16h3a2 2 0 0 1 2 2v3"/></svg>
							</button>
						</div>
					</div>
				</div>
			</div>

		</main>
	</div>

	<!-- Hidden YouTube music player (off-screen, audio only) -->
	<div id="yt-music-container" style="position:absolute;width:1px;height:1px;overflow:hidden;left:-9999px;top:-9999px;">
		<div id="yt-music-player"></div>
	</div>

	<!-- Modern Modal Dialog -->
	<div id="modal-backdrop" class="modal-backdrop hidden">
		<div class="modal-window">
			<div class="modal-header">
				<h3 id="modal-title" class="modal-title">Title</h3>
				<button id="modal-close-btn" class="modal-close-btn" title="Close">✕</button>
			</div>
			<div class="modal-body">
				<p id="modal-message" class="modal-message"></p>
				<div id="modal-input-group" class="modal-input-group">
					<input type="text" id="modal-input" class="modal-input" spellcheck="false" autocomplete="off">
				</div>
			</div>
			<div class="modal-footer">
				<button id="modal-cancel-btn" class="btn btn-ghost">Cancel</button>
				<button id="modal-confirm-btn" class="btn btn-primary">Confirm</button>
			</div>
		</div>
	</div>

	<script type="module" src="js/app.js?v=7"></script>
</body>
</html>
