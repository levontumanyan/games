[project]
name = "workout"
version = "1.0.0"
description = "Custom workout routine player with YouTube clips and interval timers"
requires-python = ">=3.11"
dependencies = [
	"fastapi>=0.115.0",
	"python-multipart>=0.0.32",
	"uvicorn[standard]>=0.30.0",
]

[dependency-groups]
dev = [
	"httpx>=0.28.1",
	"pytest>=8.0.0",
	"ruff>=0.16.3",
	"youtube-search>=2.2.0",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.format]
indent-style = "tab"
quote-style = "double"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

