<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="100%" height="100%">
	<defs>
		<linearGradient id="elbowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
			<stop offset="0%" stop-color="#8b5cf6" />
			<stop offset="100%" stop-color="#d946ef" />
		</linearGradient>
		<filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
			<feGaussianBlur stdDeviation="3" result="blur" />
			<feComposite in="SourceGraphic" in2="blur" operator="over" />
		</filter>
	</defs>
	<style>
		.ground { stroke: rgba(255,255,255,0.15); stroke-width: 3; stroke-dasharray: 6 6; }
		.elbow-strike-arm {
			transform-origin: 135px 75px;
			animation: slash-elbow 1.5s ease-in-out infinite alternate;
		}
		.fighter-torso {
			animation: torso-turn 1.5s ease-in-out infinite alternate;
			transform-origin: 140px 115px;
		}
		@keyframes slash-elbow {
			0%, 20% { transform: rotate(-35deg) scaleX(0.9); }
			80%, 100% { transform: rotate(50deg) scaleX(1.1); }
		}
		@keyframes torso-turn {
			0%, 20% { transform: rotate(-5deg); }
			80%, 100% { transform: rotate(15deg); }
		}
		.slash-arc {
			animation: slash-fade 1.5s ease-in-out infinite alternate;
		}
		@keyframes slash-fade {
			0%, 40% { opacity: 0; }
			80%, 100% { opacity: 1; filter: drop-shadow(0 0 8px #d946ef); }
		}
	</style>
	<rect width="320" height="200" rx="16" fill="#0b0d17" />
	<!-- Floor line -->
	<line x1="20" y1="155" x2="300" y2="155" class="ground" />
	<line x1="30" y1="155" x2="290" y2="155" stroke="#d946ef" stroke-width="2" opacity="0.3" />

	<!-- Stance Base Legs -->
	<line x1="140" y1="115" x2="115" y2="155" stroke="url(#elbowGrad)" stroke-width="10" stroke-linecap="round" />
	<line x1="140" y1="115" x2="165" y2="155" stroke="url(#elbowGrad)" stroke-width="10" stroke-linecap="round" />
	<circle cx="115" cy="155" r="5" fill="#8b5cf6" />
	<circle cx="165" cy="155" r="5" fill="#d946ef" />

	<!-- Fighter Upper Body -->
	<g class="fighter-torso">
		<!-- Head -->
		<circle cx="138" cy="58" r="14" fill="#fae8ff" filter="url(#glow)" />
		<!-- Guard Hand protecting jaw/temple -->
		<circle cx="155" cy="58" r="6" fill="#c084fc" />
		<line x1="138" y1="75" x2="155" y2="58" stroke="#e9d5ff" stroke-width="6" stroke-linecap="round" />

		<!-- Torso -->
		<line x1="138" y1="72" x2="140" y2="115" stroke="url(#elbowGrad)" stroke-width="12" stroke-linecap="round" filter="url(#glow)" />

		<!-- Slashing Elbow Striking Arm -->
		<g class="elbow-strike-arm">
			<!-- Shoulder to Elbow Point -->
			<line x1="135" y1="75" x2="205" y2="70" stroke="url(#elbowGrad)" stroke-width="10" stroke-linecap="round" filter="url(#glow)" />
			<!-- Forearm folded tightly against chest -->
			<line x1="205" y1="70" x2="160" y2="85" stroke="#f5d0fe" stroke-width="7" stroke-linecap="round" />
			<!-- Elbow Blade Highlight -->
			<circle cx="205" cy="70" r="7" fill="#d946ef" filter="url(#glow)" />
		</g>
	</g>

	<!-- Slashing Arc Vector -->
	<path d="M 175 45 Q 230 70 190 105" fill="none" stroke="#d946ef" stroke-width="3" stroke-linecap="round" stroke-dasharray="4 4" class="slash-arc" />

	<!-- Exercise Tag -->
	<rect x="18" y="18" width="130" height="26" rx="6" fill="rgba(217,70,239,0.15)" stroke="rgba(217,70,239,0.4)" stroke-width="1" />
	<text x="83" y="35" fill="#fae8ff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" text-anchor="middle" letter-spacing="0.5">ELBOW STRIKES</text>
</svg>
