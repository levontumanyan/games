<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="100%" height="100%">
	<defs>
		<linearGradient id="pikeGrad" x1="0%" y1="100%" x2="100%" y2="0%">
			<stop offset="0%" stop-color="#818cf8" />
			<stop offset="100%" stop-color="#c084fc" />
		</linearGradient>
		<filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
			<feGaussianBlur stdDeviation="3" result="blur" />
			<feComposite in="SourceGraphic" in2="blur" operator="over" />
		</filter>
	</defs>
	<style>
		.ground { stroke: rgba(255,255,255,0.15); stroke-width: 3; stroke-dasharray: 6 6; }
		.pike-body {
			transform-origin: 110px 148px;
			animation: pike-dip 1.8s ease-in-out infinite;
		}
		.pike-arms {
			transform-origin: 215px 148px;
			animation: pike-arms 1.8s ease-in-out infinite;
		}
		@keyframes pike-dip {
			0%, 100% { transform: translateY(0) rotate(0deg); }
			50% { transform: translateY(18px) rotate(4deg); }
		}
		@keyframes pike-arms {
			0%, 100% { transform: scaleY(1); }
			50% { transform: scaleY(0.55); }
		}
		.delt-glow {
			animation: delt-pulse 1.8s ease-in-out infinite;
		}
		@keyframes delt-pulse {
			0%, 100% { opacity: 0.4; transform: scale(1); }
			50% { opacity: 1; transform: scale(1.3); filter: drop-shadow(0 0 8px #c084fc); }
		}
	</style>
	<rect width="320" height="200" rx="16" fill="#0b0d17" />
	<!-- Floor line -->
	<line x1="20" y1="150" x2="300" y2="150" class="ground" />
	<line x1="30" y1="150" x2="290" y2="150" stroke="#c084fc" stroke-width="2" opacity="0.3" />

	<!-- Inverted-V Pike Body (Hips high in the air) -->
	<g class="pike-body">
		<!-- Feet contact point -->
		<circle cx="110" cy="146" r="6" fill="#818cf8" />
		<!-- Legs: Feet to Hips -->
		<line x1="110" y1="146" x2="155" y2="72" stroke="#818cf8" stroke-width="11" stroke-linecap="round" filter="url(#glow)" />
		<!-- Hips apex -->
		<circle cx="155" cy="72" r="7" fill="#a855f7" />
		<!-- Torso: Hips down to Shoulders -->
		<line x1="155" y1="72" x2="215" y2="108" stroke="url(#pikeGrad)" stroke-width="12" stroke-linecap="round" filter="url(#glow)" />
		<!-- Head pointing towards floor -->
		<circle cx="230" cy="120" r="13" fill="#e9d5ff" filter="url(#glow)" />
		<!-- Deltoid / Shoulder focus point -->
		<circle cx="215" cy="108" r="6" fill="#c084fc" class="delt-glow" />
	</g>

	<!-- Supporting vertical pressing arms -->
	<g class="pike-arms">
		<line x1="215" y1="108" x2="215" y2="150" stroke="#e9d5ff" stroke-width="8" stroke-linecap="round" />
		<line x1="202" y1="150" x2="228" y2="150" stroke="#c084fc" stroke-width="4" stroke-linecap="round" />
	</g>

	<!-- Exercise Tag -->
	<rect x="18" y="18" width="120" height="26" rx="6" fill="rgba(192,132,252,0.15)" stroke="rgba(192,132,252,0.4)" stroke-width="1" />
	<text x="78" y="35" fill="#e9d5ff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" text-anchor="middle" letter-spacing="0.5">PIKE PUSHUPS</text>
</svg>
