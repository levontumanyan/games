<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="100%" height="100%">
	<defs>
		<linearGradient id="checkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
			<stop offset="0%" stop-color="#ef4444" />
			<stop offset="100%" stop-color="#f97316" />
		</linearGradient>
		<filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
			<feGaussianBlur stdDeviation="3" result="blur" />
			<feComposite in="SourceGraphic" in2="blur" operator="over" />
		</filter>
	</defs>
	<style>
		.ground { stroke: rgba(255,255,255,0.15); stroke-width: 3; stroke-dasharray: 6 6; }
		.shin-check-leg {
			transform-origin: 160px 115px;
			animation: check-cycle 1.4s ease-in-out infinite alternate;
		}
		@keyframes check-cycle {
			0% { transform: rotate(0deg); }
			30% { transform: rotate(0deg); }
			80%, 100% { transform: rotate(-65deg); }
		}
		.shield-flash {
			animation: shield-pulse 1.4s ease-in-out infinite alternate;
		}
		@keyframes shield-pulse {
			0%, 40% { opacity: 0; transform: scale(0.8); }
			80%, 100% { opacity: 1; transform: scale(1.1); filter: drop-shadow(0 0 8px #ef4444); }
		}
	</style>
	<rect width="320" height="200" rx="16" fill="#0b0d17" />
	<!-- Floor line -->
	<line x1="20" y1="155" x2="300" y2="155" class="ground" />
	<line x1="40" y1="155" x2="280" y2="155" stroke="#ef4444" stroke-width="2" opacity="0.3" />

	<!-- Muay Thai Fighter Base -->
	<g>
		<!-- Head -->
		<circle cx="160" cy="58" r="14" fill="#fee2e2" filter="url(#glow)" />
		<!-- High Guard Hands -->
		<circle cx="180" cy="60" r="7" fill="#f87171" />
		<circle cx="168" cy="52" r="7" fill="#ef4444" />
		<line x1="160" y1="75" x2="180" y2="60" stroke="#fca5a5" stroke-width="6" stroke-linecap="round" />
		<line x1="160" y1="75" x2="168" y2="52" stroke="#fca5a5" stroke-width="6" stroke-linecap="round" />

		<!-- Torso -->
		<line x1="160" y1="75" x2="160" y2="115" stroke="url(#checkGrad)" stroke-width="12" stroke-linecap="round" filter="url(#glow)" />

		<!-- Planted Rear Leg -->
		<line x1="160" y1="115" x2="180" y2="155" stroke="url(#checkGrad)" stroke-width="10" stroke-linecap="round" />
		<circle cx="180" cy="155" r="5" fill="#ef4444" />
	</g>

	<!-- Raising Shin Check Leg -->
	<g class="shin-check-leg">
		<!-- Thigh & Raised Shin with Pointed Toes -->
		<line x1="160" y1="115" x2="140" y2="155" stroke="url(#checkGrad)" stroke-width="10" stroke-linecap="round" filter="url(#glow)" />
		<circle cx="140" cy="155" r="5" fill="#f87171" />
	</g>

	<!-- Shin Defense Impact Barrier -->
	<path d="M 115 80 Q 105 110 115 140" fill="none" stroke="#ef4444" stroke-width="3" stroke-dasharray="4 4" class="shield-flash" style="transform-origin: 115px 110px;" />

	<!-- Exercise Tag -->
	<rect x="18" y="18" width="130" height="26" rx="6" fill="rgba(239,68,68,0.15)" stroke="rgba(239,68,68,0.4)" stroke-width="1" />
	<text x="83" y="35" fill="#fee2e2" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" text-anchor="middle" letter-spacing="0.5">CHECK REPEATS</text>
</svg>
