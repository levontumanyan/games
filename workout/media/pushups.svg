<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="100%" height="100%">
	<defs>
		<linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
			<stop offset="0%" stop-color="#818cf8" />
			<stop offset="100%" stop-color="#6366f1" />
		</linearGradient>
		<filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
			<feGaussianBlur stdDeviation="3" result="blur" />
			<feComposite in="SourceGraphic" in2="blur" operator="over" />
		</filter>
	</defs>
	<style>
		.ground { stroke: rgba(255,255,255,0.15); stroke-width: 3; stroke-dasharray: 6 6; }
		.torso {
			transform-origin: 60px 145px;
			animation: pushup-body 2s ease-in-out infinite;
		}
		.arms {
			transform-origin: 220px 145px;
			animation: pushup-arms 2s ease-in-out infinite;
		}
		@keyframes pushup-body {
			0%, 100% { transform: rotate(0deg); }
			50% { transform: rotate(14deg); }
		}
		@keyframes pushup-arms {
			0%, 100% { transform: scaleY(1); }
			50% { transform: scaleY(0.55); }
		}
		.pulse-circle {
			animation: pulse 2s infinite ease-in-out;
		}
		@keyframes pulse {
			0%, 100% { opacity: 0.4; }
			50% { opacity: 0.9; }
		}
	</style>
	<rect width="320" height="200" rx="16" fill="#0b0d17" />
	<!-- Floor line -->
	<line x1="20" y1="150" x2="300" y2="150" class="ground" />
	<line x1="30" y1="150" x2="290" y2="150" stroke="#6366f1" stroke-width="2" opacity="0.4" />

	<!-- Animated Figure -->
	<g class="torso">
		<!-- Head -->
		<circle cx="260" cy="80" r="14" fill="#a5b4fc" filter="url(#glow)" />
		<!-- Spine / Body -->
		<line x1="60" y1="145" x2="245" y2="90" stroke="url(#bodyGrad)" stroke-width="12" stroke-linecap="round" filter="url(#glow)" />
		<!-- Rear Leg / Feet -->
		<circle cx="60" cy="145" r="7" fill="#6366f1" />
		<!-- Chest highlight -->
		<circle cx="225" cy="97" r="5" fill="#c7d2fe" class="pulse-circle" />
	</g>

	<!-- Arms attached to floor -->
	<g class="arms">
		<line x1="225" y1="97" x2="225" y2="150" stroke="#c7d2fe" stroke-width="8" stroke-linecap="round" />
		<line x1="210" y1="150" x2="240" y2="150" stroke="#818cf8" stroke-width="5" stroke-linecap="round" />
	</g>

	<!-- Exercise Tag -->
	<rect x="18" y="18" width="130" height="26" rx="6" fill="rgba(99,102,241,0.15)" stroke="rgba(99,102,241,0.4)" stroke-width="1" />
	<text x="83" y="35" fill="#c7d2fe" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" text-anchor="middle" letter-spacing="0.5">STANDARD PUSHUPS</text>
</svg>
