<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="100%" height="100%">
	<defs>
		<linearGradient id="chGrad" x1="0%" y1="0%" x2="100%" y2="100%">
			<stop offset="0%" stop-color="#06b6d4" />
			<stop offset="100%" stop-color="#3b82f6" />
		</linearGradient>
		<filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
			<feGaussianBlur stdDeviation="3" result="blur" />
			<feComposite in="SourceGraphic" in2="blur" operator="over" />
		</filter>
	</defs>
	<style>
		.ground { stroke: rgba(255,255,255,0.15); stroke-width: 3; stroke-dasharray: 6 6; }
		.child-torso {
			animation: child-reach 4s ease-in-out infinite;
			transform-origin: 90px 145px;
		}
		@keyframes child-reach {
			0%, 100% { transform: scaleX(1); }
			50% { transform: scaleX(1.05) translateY(2px); }
		}
	</style>
	<rect width="320" height="200" rx="16" fill="#0b0d17" />
	<!-- Floor line -->
	<line x1="20" y1="150" x2="300" y2="150" class="ground" />
	<line x1="30" y1="150" x2="290" y2="150" stroke="#06b6d4" stroke-width="2" opacity="0.4" />

	<!-- Folded Legs under hips -->
	<circle cx="85" cy="138" r="14" fill="#3b82f6" />
	<line x1="75" y1="145" x2="115" y2="145" stroke="#3b82f6" stroke-width="12" stroke-linecap="round" />

	<!-- Extended Spine & Forward Reaching Arms -->
	<g class="child-torso">
		<!-- Curved Low Back & Spine -->
		<path d="M 90 135 Q 140 120 200 138" fill="none" stroke="url(#chGrad)" stroke-width="12" stroke-linecap="round" filter="url(#glow)" />
		<!-- Head rested low -->
		<circle cx="210" cy="135" r="13" fill="#a5f3fc" filter="url(#glow)" />
		<!-- Outstretched Arms along floor -->
		<line x1="180" y1="130" x2="265" y2="146" stroke="#a5f3fc" stroke-width="8" stroke-linecap="round" />
	</g>

	<!-- Stretch Tag -->
	<rect x="18" y="18" width="130" height="26" rx="6" fill="rgba(6,182,212,0.15)" stroke="rgba(6,182,212,0.4)" stroke-width="1" />
	<text x="83" y="35" fill="#a5f3fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" text-anchor="middle" letter-spacing="0.5">CHILD'S POSE</text>
</svg>
