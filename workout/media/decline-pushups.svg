<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="100%" height="100%">
	<defs>
		<linearGradient id="declineGrad" x1="0%" y1="0%" x2="100%" y2="100%">
			<stop offset="0%" stop-color="#38bdf8" />
			<stop offset="100%" stop-color="#818cf8" />
		</linearGradient>
		<filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
			<feGaussianBlur stdDeviation="3" result="blur" />
			<feComposite in="SourceGraphic" in2="blur" operator="over" />
		</filter>
	</defs>
	<style>
		.ground { stroke: rgba(255,255,255,0.15); stroke-width: 3; stroke-dasharray: 6 6; }
		.bench { fill: #1e293b; stroke: #38bdf8; stroke-width: 1.5; }
		.decline-torso {
			transform-origin: 65px 115px;
			animation: decline-body 1.8s ease-in-out infinite;
		}
		.decline-arms {
			transform-origin: 220px 148px;
			animation: decline-arms 1.8s ease-in-out infinite;
		}
		@keyframes decline-body {
			0%, 100% { transform: rotate(0deg); }
			50% { transform: rotate(14deg); }
		}
		@keyframes decline-arms {
			0%, 100% { transform: scaleY(1); }
			50% { transform: scaleY(0.48); }
		}
		.target-glow {
			animation: d-pulse 1.8s ease-in-out infinite;
		}
		@keyframes d-pulse {
			0%, 100% { opacity: 0.4; }
			50% { opacity: 1; filter: drop-shadow(0 0 6px #38bdf8); }
		}
	</style>
	<rect width="320" height="200" rx="16" fill="#0b0d17" />
	<!-- Floor line -->
	<line x1="20" y1="150" x2="300" y2="150" class="ground" />
	<line x1="30" y1="150" x2="290" y2="150" stroke="#38bdf8" stroke-width="2" opacity="0.3" />

	<!-- Elevation Bench / Box -->
	<rect x="40" y="115" width="45" height="35" rx="4" class="bench" />
	<line x1="40" y1="115" x2="85" y2="115" stroke="#38bdf8" stroke-width="3" />

	<!-- Animated Body Pivoting from Feet on Bench -->
	<g class="decline-torso">
		<!-- Feet contact point -->
		<circle cx="65" cy="113" r="6" fill="#38bdf8" />
		<!-- Decline Body Line (angled down to chest) -->
		<line x1="65" y1="115" x2="235" y2="92" stroke="url(#declineGrad)" stroke-width="12" stroke-linecap="round" filter="url(#glow)" />
		<!-- Head -->
		<circle cx="255" cy="85" r="14" fill="#bae6fd" filter="url(#glow)" />
		<!-- Clavicular / Upper Chest highlight -->
		<circle cx="218" cy="98" r="5" fill="#38bdf8" class="target-glow" />
	</g>

	<!-- Supporting Arms attached to floor -->
	<g class="decline-arms">
		<line x1="220" y1="98" x2="220" y2="150" stroke="#bae6fd" stroke-width="8" stroke-linecap="round" />
		<line x1="205" y1="150" x2="235" y2="150" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" />
	</g>

	<!-- Exercise Tag -->
	<rect x="18" y="18" width="135" height="26" rx="6" fill="rgba(56,189,248,0.15)" stroke="rgba(56,189,248,0.4)" stroke-width="1" />
	<text x="85" y="35" fill="#bae6fd" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" text-anchor="middle" letter-spacing="0.5">DECLINE PUSHUPS</text>
</svg>
