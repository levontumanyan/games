<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="100%" height="100%">
	<defs>
		<linearGradient id="pigGrad" x1="0%" y1="0%" x2="100%" y2="100%">
			<stop offset="0%" stop-color="#10b981" />
			<stop offset="100%" stop-color="#84cc16" />
		</linearGradient>
		<filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
			<feGaussianBlur stdDeviation="3" result="blur" />
			<feComposite in="SourceGraphic" in2="blur" operator="over" />
		</filter>
	</defs>
	<style>
		.ground { stroke: rgba(255,255,255,0.15); stroke-width: 3; stroke-dasharray: 6 6; }
		.pigeon-torso {
			animation: pigeon-sink 3.5s ease-in-out infinite;
			transform-origin: 180px 148px;
		}
		@keyframes pigeon-sink {
			0%, 100% { transform: rotate(0deg); }
			50% { transform: rotate(4deg) translateY(3px); }
		}
	</style>
	<rect width="320" height="200" rx="16" fill="#0b0d17" />
	<!-- Floor line -->
	<line x1="20" y1="150" x2="300" y2="150" class="ground" />
	<line x1="30" y1="150" x2="290" y2="150" stroke="#10b981" stroke-width="2" opacity="0.4" />

	<!-- Back leg extended on ground -->
	<line x1="45" y1="148" x2="175" y2="148" stroke="#10b981" stroke-width="12" stroke-linecap="round" />
	<circle cx="45" cy="148" r="6" fill="#84cc16" />

	<!-- Front leg bent under hip -->
	<path d="M 175 148 L 195 140 L 175 148" stroke="#84cc16" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" />

	<!-- Torso & Arms -->
	<g class="pigeon-torso">
		<!-- Torso -->
		<line x1="175" y1="148" x2="210" y2="85" stroke="url(#pigGrad)" stroke-width="12" stroke-linecap="round" filter="url(#glow)" />
		<!-- Head -->
		<circle cx="218" cy="72" r="14" fill="#d9f99d" filter="url(#glow)" />
		<!-- Hand on floor -->
		<line x1="200" y1="105" x2="225" y2="148" stroke="#d9f99d" stroke-width="7" stroke-linecap="round" />
	</g>

	<!-- Stretch Tag -->
	<rect x="18" y="18" width="150" height="26" rx="6" fill="rgba(16,185,129,0.15)" stroke="rgba(16,185,129,0.4)" stroke-width="1" />
	<text x="93" y="35" fill="#d9f99d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" text-anchor="middle" letter-spacing="0.5">PIGEON POSE / GLUTE</text>
</svg>
