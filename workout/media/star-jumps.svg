<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="100%" height="100%">
	<defs>
		<linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="100%">
			<stop offset="0%" stop-color="#06b6d4" />
			<stop offset="100%" stop-color="#3b82f6" />
		</linearGradient>
		<filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
			<feGaussianBlur stdDeviation="3" result="blur" />
			<feComposite in="SourceGraphic" in2="blur" operator="over" />
		</filter>
	</defs>
	<style>
		.ground { stroke: rgba(255,255,255,0.15); stroke-width: 3; stroke-dasharray: 6 6; }
		.jumper-figure {
			animation: star-jump 1.2s cubic-bezier(0.25, 1, 0.5, 1) infinite alternate;
			transform-origin: 160px 145px;
		}
		@keyframes star-jump {
			0% { transform: translateY(0) scale(0.95); }
			30% { transform: translateY(10px) scale(0.9, 0.85); }
			100% { transform: translateY(-40px) scale(1.1); }
		}
		.arms-star {
			animation: arms-expand 1.2s cubic-bezier(0.25, 1, 0.5, 1) infinite alternate;
			transform-origin: 160px 85px;
		}
		@keyframes arms-expand {
			0%, 30% { transform: scale(0.6) rotate(15deg); }
			100% { transform: scale(1.15) rotate(0deg); }
		}
		.legs-star {
			animation: legs-expand 1.2s cubic-bezier(0.25, 1, 0.5, 1) infinite alternate;
			transform-origin: 160px 120px;
		}
		@keyframes legs-expand {
			0%, 30% { transform: scaleX(0.4); }
			100% { transform: scaleX(1.3); }
		}
		.star-sparkle {
			animation: sparkle 1.2s ease-in-out infinite alternate;
		}
		@keyframes sparkle {
			0%, 40% { opacity: 0; transform: scale(0.5); }
			100% { opacity: 1; transform: scale(1.2); }
		}
	</style>
	<rect width="320" height="200" rx="16" fill="#0b0d17" />
	<!-- Floor line -->
	<line x1="20" y1="160" x2="300" y2="160" class="ground" />
	<line x1="40" y1="160" x2="280" y2="160" stroke="#06b6d4" stroke-width="2" opacity="0.3" />

	<!-- Jumping Figure -->
	<g class="jumper-figure">
		<!-- Torso / Spine -->
		<line x1="160" y1="85" x2="160" y2="125" stroke="url(#starGrad)" stroke-width="12" stroke-linecap="round" filter="url(#glow)" />
		<!-- Head -->
		<circle cx="160" cy="65" r="14" fill="#cffafe" filter="url(#glow)" />

		<!-- Dynamic Expanding Star Arms -->
		<g class="arms-star">
			<line x1="160" y1="85" x2="105" y2="45" stroke="#38bdf8" stroke-width="8" stroke-linecap="round" filter="url(#glow)" />
			<line x1="160" y1="85" x2="215" y2="45" stroke="#38bdf8" stroke-width="8" stroke-linecap="round" filter="url(#glow)" />
		</g>

		<!-- Dynamic Expanding Star Legs -->
		<g class="legs-star">
			<line x1="160" y1="125" x2="115" y2="170" stroke="url(#starGrad)" stroke-width="10" stroke-linecap="round" filter="url(#glow)" />
			<line x1="160" y1="125" x2="205" y2="170" stroke="url(#starGrad)" stroke-width="10" stroke-linecap="round" filter="url(#glow)" />
		</g>

		<!-- Apex Energy Sparks -->
		<g class="star-sparkle" style="transform-origin: 160px 65px;">
			<polygon points="160,35 163,45 173,48 163,51 160,61 157,51 147,48 157,45" fill="#38bdf8" />
		</g>
	</g>

	<!-- Exercise Tag -->
	<rect x="18" y="18" width="110" height="26" rx="6" fill="rgba(6,182,212,0.15)" stroke="rgba(6,182,212,0.4)" stroke-width="1" />
	<text x="73" y="35" fill="#cffafe" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" text-anchor="middle" letter-spacing="0.5">STAR JUMPS</text>
</svg>
