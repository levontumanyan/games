<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="100%" height="100%">
	<defs>
		<linearGradient id="punchGrad" x1="0%" y1="0%" x2="100%" y2="100%">
			<stop offset="0%" stop-color="#f97316" />
			<stop offset="100%" stop-color="#eab308" />
		</linearGradient>
		<filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
			<feGaussianBlur stdDeviation="3" result="blur" />
			<feComposite in="SourceGraphic" in2="blur" operator="over" />
		</filter>
	</defs>
	<style>
		.ground { stroke: rgba(255,255,255,0.15); stroke-width: 3; stroke-dasharray: 6 6; }
		.boxer-torso {
			animation: boxer-combo 1.8s ease-in-out infinite;
			transform-origin: 120px 115px;
		}
		.lead-jab {
			animation: punch-jab 1.8s ease-in-out infinite;
		}
		.rear-cross {
			animation: punch-cross 1.8s ease-in-out infinite;
		}
		@keyframes boxer-combo {
			0%, 100% { transform: rotate(0deg); }
			25% { transform: rotate(-5deg); }
			65% { transform: rotate(12deg); }
		}
		@keyframes punch-jab {
			0%, 45%, 100% { transform: scaleX(0.4) translateX(0); opacity: 0.8; }
			20% { transform: scaleX(1.3) translateX(30px); opacity: 1; filter: drop-shadow(0 0 8px #f97316); }
		}
		@keyframes punch-cross {
			0%, 45%, 100% { transform: scaleX(0.4) translateX(0); opacity: 0.8; }
			65% { transform: scaleX(1.45) translateX(45px); opacity: 1; filter: drop-shadow(0 0 8px #eab308); }
		}
	</style>
	<rect width="320" height="200" rx="16" fill="#0b0d17" />
	<!-- Floor line -->
	<line x1="20" y1="155" x2="300" y2="155" class="ground" />
	<line x1="30" y1="155" x2="290" y2="155" stroke="#f97316" stroke-width="2" opacity="0.3" />

	<!-- Stance Legs -->
	<line x1="120" y1="115" x2="95" y2="155" stroke="url(#punchGrad)" stroke-width="10" stroke-linecap="round" />
	<line x1="120" y1="115" x2="145" y2="155" stroke="url(#punchGrad)" stroke-width="10" stroke-linecap="round" />
	<circle cx="95" cy="155" r="5" fill="#f97316" />
	<circle cx="145" cy="155" r="5" fill="#eab308" />

	<!-- Boxing Athlete Upper Body & Rotation -->
	<g class="boxer-torso">
		<!-- Head with Chin Tucked -->
		<circle cx="120" cy="62" r="14" fill="#ffedd5" filter="url(#glow)" />
		<!-- Torso -->
		<line x1="120" y1="76" x2="120" y2="115" stroke="url(#punchGrad)" stroke-width="12" stroke-linecap="round" filter="url(#glow)" />

		<!-- Lead Jab Punch (Fast snap) -->
		<g class="lead-jab" style="transform-origin: 120px 80px;">
			<line x1="120" y1="80" x2="215" y2="75" stroke="#fed7aa" stroke-width="7" stroke-linecap="round" />
			<circle cx="215" cy="75" r="8" fill="#f97316" filter="url(#glow)" />
		</g>

		<!-- Rear Cross Punch (Power extension) -->
		<g class="rear-cross" style="transform-origin: 110px 82px;">
			<line x1="110" y1="82" x2="225" y2="78" stroke="#fef08a" stroke-width="8" stroke-linecap="round" />
			<circle cx="225" cy="78" r="9" fill="#eab308" filter="url(#glow)" />
		</g>
	</g>

	<!-- Exercise Tag -->
	<rect x="18" y="18" width="135" height="26" rx="6" fill="rgba(249,115,22,0.15)" stroke="rgba(249,115,22,0.4)" stroke-width="1" />
	<text x="85" y="35" fill="#ffedd5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" text-anchor="middle" letter-spacing="0.5">JAB-CROSS COMBO</text>
</svg>
