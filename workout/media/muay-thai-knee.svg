<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="100%" height="100%">
	<defs>
		<linearGradient id="kneeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
			<stop offset="0%" stop-color="#ec4899" />
			<stop offset="100%" stop-color="#f43f5e" />
		</linearGradient>
		<filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
			<feGaussianBlur stdDeviation="3" result="blur" />
			<feComposite in="SourceGraphic" in2="blur" operator="over" />
		</filter>
	</defs>
	<style>
		.ground { stroke: rgba(255,255,255,0.15); stroke-width: 3; stroke-dasharray: 6 6; }
		.knee-thrust-leg {
			transform-origin: 130px 115px;
			animation: knee-strike 1.6s ease-in-out infinite alternate;
		}
		.clinch-arms {
			transform-origin: 130px 75px;
			animation: clinch-pull 1.6s ease-in-out infinite alternate;
		}
		@keyframes knee-strike {
			0%, 20% { transform: rotate(0deg) translate(0, 0); }
			80%, 100% { transform: rotate(-80deg) translate(25px, -15px); }
		}
		@keyframes clinch-pull {
			0%, 20% { transform: translateY(0); }
			80%, 100% { transform: translateY(18px) rotate(-10deg); }
		}
		.strike-flare {
			animation: flare-burst 1.6s ease-in-out infinite alternate;
		}
		@keyframes flare-burst {
			0%, 60% { opacity: 0; transform: scale(0.5); }
			80%, 100% { opacity: 1; transform: scale(1.3); filter: drop-shadow(0 0 10px #f43f5e); }
		}
	</style>
	<rect width="320" height="200" rx="16" fill="#0b0d17" />
	<!-- Floor line -->
	<line x1="20" y1="155" x2="300" y2="155" class="ground" />
	<line x1="40" y1="155" x2="280" y2="155" stroke="#f43f5e" stroke-width="2" opacity="0.3" />

	<!-- Standing Base Fighter -->
	<g>
		<!-- Head leaning back for leverage -->
		<circle cx="115" cy="55" r="14" fill="#fce7f3" filter="url(#glow)" />
		<!-- Torso arched back -->
		<line x1="115" y1="69" x2="130" y2="115" stroke="url(#kneeGrad)" stroke-width="12" stroke-linecap="round" filter="url(#glow)" />

		<!-- Clinch Arms pulling downward -->
		<g class="clinch-arms">
			<path d="M 120 75 Q 170 55 195 85" fill="none" stroke="#fbcfe8" stroke-width="7" stroke-linecap="round" />
			<circle cx="195" cy="85" r="6" fill="#f43f5e" />
		</g>

		<!-- Base Support Leg on Toes -->
		<line x1="130" y1="115" x2="115" y2="155" stroke="url(#kneeGrad)" stroke-width="10" stroke-linecap="round" />
		<circle cx="115" cy="155" r="5" fill="#ec4899" />
	</g>

	<!-- Explosive Knee Thrust Unit -->
	<g class="knee-thrust-leg">
		<!-- Thigh driven up & forward -->
		<line x1="130" y1="115" x2="175" y2="105" stroke="url(#kneeGrad)" stroke-width="12" stroke-linecap="round" filter="url(#glow)" />
		<!-- Pointed Lower Leg / Shin folded tight -->
		<line x1="175" y1="105" x2="135" y2="135" stroke="#f43f5e" stroke-width="8" stroke-linecap="round" />
		<!-- Knee Apex -->
		<circle cx="175" cy="105" r="8" fill="#fda4af" class="strike-flare" style="transform-origin: 175px 105px;" />
	</g>

	<!-- Exercise Tag -->
	<rect x="18" y="18" width="145" height="26" rx="6" fill="rgba(244,63,94,0.15)" stroke="rgba(244,63,94,0.4)" stroke-width="1" />
	<text x="90" y="35" fill="#fce7f3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" text-anchor="middle" letter-spacing="0.5">KNEE STRIKE THRUST</text>
</svg>
