<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="100%" height="100%">
	<defs>
		<linearGradient id="stretchGrad" x1="0%" y1="0%" x2="100%" y2="100%">
			<stop offset="0%" stop-color="#10b981" />
			<stop offset="100%" stop-color="#06b6d4" />
		</linearGradient>
		<filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
			<feGaussianBlur stdDeviation="3" result="blur" />
			<feComposite in="SourceGraphic" in2="blur" operator="over" />
		</filter>
	</defs>
	<style>
		.ground { stroke: rgba(255,255,255,0.15); stroke-width: 3; stroke-dasharray: 6 6; }
		.cobra-torso {
			transform-origin: 150px 148px;
			animation: cobra-breathe 4s ease-in-out infinite;
		}
		@keyframes cobra-breathe {
			0%, 100% { transform: rotate(0deg); }
			50% { transform: rotate(-8deg); }
		}
	</style>
	<rect width="320" height="200" rx="16" fill="#0b0d17" />
	<!-- Floor line -->
	<line x1="20" y1="150" x2="300" y2="150" class="ground" />
	<line x1="30" y1="150" x2="290" y2="150" stroke="#10b981" stroke-width="2" opacity="0.4" />

	<!-- Legs flat on floor -->
	<line x1="50" y1="148" x2="155" y2="148" stroke="#10b981" stroke-width="12" stroke-linecap="round" />
	<circle cx="50" cy="148" r="6" fill="#06b6d4" />

	<!-- Arching upper body -->
	<g class="cobra-torso">
		<!-- Curved Spine upward -->
		<path d="M 150 148 Q 190 145 220 85" fill="none" stroke="url(#stretchGrad)" stroke-width="12" stroke-linecap="round" filter="url(#glow)" />
		<!-- Head tilted back -->
		<circle cx="232" cy="70" r="14" fill="#a7f3d0" filter="url(#glow)" />
		<!-- Supporting Straight Arms -->
		<line x1="205" y1="110" x2="215" y2="150" stroke="#a7f3d0" stroke-width="8" stroke-linecap="round" />
	</g>

	<!-- Stretch Tag -->
	<rect x="18" y="18" width="135" height="26" rx="6" fill="rgba(16,185,129,0.15)" stroke="rgba(16,185,129,0.4)" stroke-width="1" />
	<text x="85" y="35" fill="#a7f3d0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" text-anchor="middle" letter-spacing="0.5">COBRA STRETCH</text>
</svg>
