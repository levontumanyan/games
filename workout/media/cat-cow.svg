<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="100%" height="100%">
	<defs>
		<linearGradient id="catCowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
			<stop offset="0%" stop-color="#10b981" />
			<stop offset="100%" stop-color="#3b82f6" />
		</linearGradient>
		<filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
			<feGaussianBlur stdDeviation="3" result="blur" />
			<feComposite in="SourceGraphic" in2="blur" operator="over" />
		</filter>
	</defs>
	<style>
		.ground { stroke: rgba(255,255,255,0.15); stroke-width: 3; stroke-dasharray: 6 6; }
		.spine-flow {
			animation: cat-cow-cycle 4s ease-in-out infinite;
		}
		.head-flow {
			animation: head-cycle 4s ease-in-out infinite;
		}
		@keyframes cat-cow-cycle {
			0%, 100% { d: path('M 95 120 Q 155 140 215 115'); } /* Cow: Dropped belly, swayed spine */
			50% { d: path('M 95 120 Q 155 80 215 115'); }   /* Cat: Arched high back */
		}
		@keyframes head-cycle {
			0%, 100% { transform: translateY(-10px); } /* Cow: Gaze up */
			50% { transform: translateY(12px); }       /* Cat: Tucked chin */
		}
	</style>
	<rect width="320" height="200" rx="16" fill="#0b0d17" />
	<!-- Floor line -->
	<line x1="20" y1="150" x2="300" y2="150" class="ground" />
	<line x1="30" y1="150" x2="290" y2="150" stroke="#10b981" stroke-width="2" opacity="0.3" />

	<!-- Tabletop Base Limbs -->
	<!-- Knees / Thighs -->
	<line x1="95" y1="120" x2="95" y2="150" stroke="#a7f3d0" stroke-width="9" stroke-linecap="round" />
	<circle cx="95" cy="150" r="5" fill="#10b981" />
	<line x1="85" y1="150" x2="105" y2="150" stroke="#06b6d4" stroke-width="4" stroke-linecap="round" />

	<!-- Hands / Arms -->
	<line x1="215" y1="115" x2="215" y2="150" stroke="#a7f3d0" stroke-width="9" stroke-linecap="round" />
	<circle cx="215" cy="150" r="5" fill="#3b82f6" />
	<line x1="205" y1="150" x2="225" y2="150" stroke="#3b82f6" stroke-width="4" stroke-linecap="round" />

	<!-- Dynamic Oscillating Spine -->
	<path class="spine-flow" d="M 95 120 Q 155 140 215 115" fill="none" stroke="url(#catCowGrad)" stroke-width="12" stroke-linecap="round" filter="url(#glow)" />

	<!-- Dynamic Articulating Head & Neck -->
	<g class="head-flow" style="transform-origin: 215px 115px;">
		<line x1="215" y1="115" x2="245" y2="100" stroke="#a7f3d0" stroke-width="8" stroke-linecap="round" />
		<circle cx="255" cy="95" r="13" fill="#d1fae5" filter="url(#glow)" />
	</g>

	<!-- Exercise Tag -->
	<rect x="18" y="18" width="135" height="26" rx="6" fill="rgba(16,185,129,0.15)" stroke="rgba(16,185,129,0.4)" stroke-width="1" />
	<text x="85" y="35" fill="#a7f3d0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" text-anchor="middle" letter-spacing="0.5">CAT-COW MOBILITY</text>
</svg>
