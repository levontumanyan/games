<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="100%" height="100%">
	<defs>
		<linearGradient id="shGrad" x1="0%" y1="0%" x2="100%" y2="100%">
			<stop offset="0%" stop-color="#38bdf8" />
			<stop offset="100%" stop-color="#818cf8" />
		</linearGradient>
		<filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
			<feGaussianBlur stdDeviation="3" result="blur" />
			<feComposite in="SourceGraphic" in2="blur" operator="over" />
		</filter>
	</defs>
	<style>
		.standing-body {
			animation: standing-sway 3s ease-in-out infinite;
			transform-origin: 160px 160px;
		}
		.stretching-arm {
			animation: stretch-pull 3s ease-in-out infinite;
			transform-origin: 160px 70px;
		}
		@keyframes standing-sway {
			0%, 100% { transform: scale(1); }
			50% { transform: scale(1.02); }
		}
		@keyframes stretch-pull {
			0%, 100% { transform: rotate(0deg); }
			50% { transform: rotate(-5deg); }
		}
	</style>
	<rect width="320" height="200" rx="16" fill="#0b0d17" />
	<!-- Floor line -->
	<line x1="60" y1="180" x2="260" y2="180" stroke="rgba(255,255,255,0.15)" stroke-width="2" stroke-dasharray="4 4" />

	<!-- Standing Figure -->
	<g class="standing-body">
		<!-- Legs -->
		<line x1="145" y1="130" x2="145" y2="180" stroke="#818cf8" stroke-width="8" stroke-linecap="round" />
		<line x1="175" y1="130" x2="175" y2="180" stroke="#818cf8" stroke-width="8" stroke-linecap="round" />
		<!-- Torso -->
		<line x1="160" y1="75" x2="160" y2="135" stroke="url(#shGrad)" stroke-width="14" stroke-linecap="round" filter="url(#glow)" />
		<!-- Head -->
		<circle cx="160" cy="52" r="14" fill="#bae6fd" filter="url(#glow)" />

		<!-- Bent Overhead Arm being stretched -->
		<path d="M 152 75 L 140 45 L 165 42 L 165 65" fill="none" stroke="#bae6fd" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />

		<!-- Assisting Hand holding elbow -->
		<g class="stretching-arm">
			<path d="M 168 75 L 175 48 L 145 44" fill="none" stroke="#38bdf8" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
			<circle cx="143" cy="44" r="5" fill="#a5b4fc" />
		</g>
	</g>

	<!-- Stretch Tag -->
	<rect x="18" y="18" width="160" height="26" rx="6" fill="rgba(56,189,248,0.15)" stroke="rgba(56,189,248,0.4)" stroke-width="1" />
	<text x="98" y="35" fill="#bae6fd" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" text-anchor="middle" letter-spacing="0.5">SHOULDER &amp; TRICEP</text>
</svg>
