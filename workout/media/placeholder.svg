<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="100%" height="100%">
	<defs>
		<linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
			<stop offset="0%" stop-color="#141720" />
			<stop offset="100%" stop-color="#0b0d14" />
		</linearGradient>
	</defs>
	<rect width="320" height="200" rx="12" fill="url(#bgGrad)" />
	<rect x="2" y="2" width="316" height="196" rx="10" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1.5" stroke-dasharray="6 6" />

	<!-- Neutral Media / Camera & Play Icon -->
	<g transform="translate(160, 92)" opacity="0.35">
		<!-- Card Frame -->
		<rect x="-42" y="-32" width="84" height="64" rx="8" fill="none" stroke="#94a3b8" stroke-width="2.5" />
		<!-- Mountain / Image placeholder outline -->
		<path d="M-30 20 L-8 -6 L8 14 L20 2 L32 20 Z" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linejoin="round" />
		<!-- Sun / Lens dot -->
		<circle cx="18" cy="-14" r="5" fill="#94a3b8" />
	</g>

	<!-- Subtle Caption -->
	<text x="160" y="150" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" text-anchor="middle" letter-spacing="0.4">NO MEDIA PREVIEW</text>
</svg>
