<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="100%" height="100%">
	<defs>
		<linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
			<stop offset="0%" stop-color="#38bdf8" />
			<stop offset="100%" stop-color="#6366f1" />
		</linearGradient>
		<filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
			<feGaussianBlur stdDeviation="3" result="blur" />
			<feComposite in="SourceGraphic" in2="blur" operator="over" />
		</filter>
	</defs>
	<style>
		.ground { stroke: rgba(255,255,255,0.15); stroke-width: 3; stroke-dasharray: 6 6; }
		.torso {
			transform-origin: 60px 145px;
			animation: pushup-body 1.8s ease-in-out infinite;
		}
		.arms {
			transform-origin: 215px 145px;
			animation: pushup-arms 1.8s ease-in-out infinite;
		}
		@keyframes pushup-body {
			0%, 100% { transform: rotate(0deg); }
			50% { transform: rotate(15deg); }
		}
		@keyframes pushup-arms {
			0%, 100% { transform: scaleY(1); }
			50% { transform: scaleY(0.5); }
		}
		.diamond-glow {
			animation: d-pulse 1.8s ease-in-out infinite;
		}
		@keyframes d-pulse {
			0%, 100% { transform: scale(1); opacity: 0.8; }
			50% { transform: scale(1.3); opacity: 1; filter: drop-shadow(0 0 8px #38bdf8); }
		}
	</style>
	<rect width="320" height="200" rx="16" fill="#0b0d17" />
	<!-- Floor line -->
	<line x1="20" y1="150" x2="300" y2="150" class="ground" />
	<line x1="30" y1="150" x2="290" y2="150" stroke="#38bdf8" stroke-width="2" opacity="0.4" />

	<!-- Animated Figure -->
	<g class="torso">
		<!-- Head -->
		<circle cx="260" cy="80" r="14" fill="#bae6fd" filter="url(#glow)" />
		<!-- Spine / Body -->
		<line x1="60" y1="145" x2="245" y2="90" stroke="url(#bodyGrad)" stroke-width="12" stroke-linecap="round" filter="url(#glow)" />
		<!-- Rear Leg / Feet -->
		<circle cx="60" cy="145" r="7" fill="#6366f1" />
	</g>

	<!-- Close Arms / Diamond Hand position -->
	<g class="arms">
		<line x1="225" y1="97" x2="215" y2="150" stroke="#bae6fd" stroke-width="8" stroke-linecap="round" />
		<!-- Diamond hand indicator -->
		<polygon points="215,143 220,150 215,157 210,150" fill="#38bdf8" class="diamond-glow" />
	</g>

	<!-- Exercise Tag -->
	<rect x="18" y="18" width="130" height="26" rx="6" fill="rgba(56,189,248,0.15)" stroke="rgba(56,189,248,0.4)" stroke-width="1" />
	<text x="83" y="35" fill="#bae6fd" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" text-anchor="middle" letter-spacing="0.5">DIAMOND PUSHUPS</text>
</svg>
