<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="100%" height="100%">
	<defs>
		<linearGradient id="coordGrad" x1="0%" y1="0%" x2="100%" y2="100%">
			<stop offset="0%" stop-color="#14b8a6" />
			<stop offset="100%" stop-color="#06b6d4" />
		</linearGradient>
		<filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
			<feGaussianBlur stdDeviation="3" result="blur" />
			<feComposite in="SourceGraphic" in2="blur" operator="over" />
		</filter>
	</defs>
	<style>
		.ground { stroke: rgba(255,255,255,0.15); stroke-width: 3; stroke-dasharray: 6 6; }
		.footwork-body {
			animation: footwork-bounce 0.5s ease-in-out infinite alternate;
			transform-origin: 160px 145px;
		}
		@keyframes footwork-bounce {
			0% { transform: translateY(0) rotate(-2deg); }
			100% { transform: translateY(-8px) rotate(2deg); }
		}
		.lead-foot {
			animation: step-lead 0.5s ease-in-out infinite alternate;
		}
		.rear-foot {
			animation: step-rear 0.5s ease-in-out infinite alternate;
		}
		@keyframes step-lead {
			0% { transform: translateX(-10px) translateY(-5px); }
			100% { transform: translateX(10px) translateY(0); }
		}
		@keyframes step-rear {
			0% { transform: translateX(10px) translateY(0); }
			100% { transform: translateX(-10px) translateY(-5px); }
		}
		.agility-rings {
			animation: ring-pulse 1s ease-in-out infinite alternate;
		}
		@keyframes ring-pulse {
			0% { opacity: 0.3; transform: scaleX(0.9); }
			100% { opacity: 0.8; transform: scaleX(1.1); }
		}
	</style>
	<rect width="320" height="200" rx="16" fill="#0b0d17" />
	<!-- Agility Ladder / Floor markers -->
	<line x1="20" y1="155" x2="300" y2="155" class="ground" />
	<ellipse cx="140" cy="155" rx="25" ry="6" stroke="#14b8a6" stroke-width="1.5" fill="none" class="agility-rings" style="transform-origin: 140px 155px;" />
	<ellipse cx="190" cy="155" rx="25" ry="6" stroke="#06b6d4" stroke-width="1.5" fill="none" class="agility-rings" style="transform-origin: 190px 155px;" />

	<!-- Bouncing Athlete Figure with Guard -->
	<g class="footwork-body">
		<!-- Head -->
		<circle cx="160" cy="65" r="14" fill="#ccfbf1" filter="url(#glow)" />
		<!-- Guard Hands -->
		<circle cx="178" cy="72" r="6" fill="#2dd4bf" />
		<circle cx="150" cy="78" r="6" fill="#14b8a6" />
		<!-- Torso -->
		<line x1="160" y1="80" x2="160" y2="120" stroke="url(#coordGrad)" stroke-width="12" stroke-linecap="round" filter="url(#glow)" />

		<!-- Lead Leg -->
		<g class="lead-foot">
			<line x1="160" y1="120" x2="140" y2="155" stroke="url(#coordGrad)" stroke-width="9" stroke-linecap="round" />
			<circle cx="140" cy="155" r="5" fill="#2dd4bf" />
		</g>

		<!-- Rear Leg -->
		<g class="rear-foot">
			<line x1="160" y1="120" x2="185" y2="155" stroke="url(#coordGrad)" stroke-width="9" stroke-linecap="round" />
			<circle cx="185" cy="155" r="5" fill="#14b8a6" />
		</g>
	</g>

	<!-- Exercise Tag -->
	<rect x="18" y="18" width="165" height="26" rx="6" fill="rgba(20,184,166,0.15)" stroke="rgba(20,184,166,0.4)" stroke-width="1" />
	<text x="100" y="35" fill="#ccfbf1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" text-anchor="middle" letter-spacing="0.5">COORDINATION FOOTWORK</text>
</svg>
