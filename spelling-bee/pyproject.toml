[project]
name = "spelling-bee"
version = "0.1.0"
description = "Browser-based Spelling Bee game with auto-shuffling letters"
requires-python = ">=3.11"
dependencies = [
	"fastapi>=0.141.1",
	"uvicorn[standard]>=0.52.3",
]

[project.scripts]
serve = "uvicorn app.main:app --reload --host 0.0.0.0 --port 8765"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.format]
indent-style = "tab"
quote-style = "double"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[dependency-groups]
dev = [
	"httpx>=0.28.1",
	"pytest>=9.1.1",
	"pytest-asyncio>=1.4.0",
	"ruff>=0.16.3",
	"websockets>=17.0.1",
]
