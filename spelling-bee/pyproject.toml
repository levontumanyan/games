[project]
name = "spelling-bee"
version = "0.1.0"
description = "Browser-based Spelling Bee game with auto-shuffling letters"
requires-python = ">=3.11"
dependencies = [
	"fastapi>=0.141.1",
	"uvicorn[standard]>=0.52.3",
]

[project.scripts]
serve = "uvicorn app.main:app --reload --host 0.0.0.0 --port 8765"

[tool.ruff]
line-length = 100
indent-width = 1

[tool.ruff.lint]
select = ["E", "F", "I"]
